<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Phân Tích Cầu Baccarat</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --accent: #f43f5e;
            --banker: #ef4444;
            --player: #3b82f6;
            --tie: #10b981;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); padding: 15px; line-height: 1.5; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 1.2rem; text-align: center; margin-bottom: 15px; color: var(--primary); text-transform: uppercase; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card h2 { font-size: 0.95rem; margin-bottom: 10px; color: var(--primary); border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
        button { padding: 12px; font-size: 0.95rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
        button:active { opacity: 0.7; }
        .btn-banker { background-color: var(--banker); }
        .btn-player { background-color: var(--player); }
        .btn-tie { background-color: var(--tie); }
        .btn-action { background-color: #475569; width: 100%; margin-top: 5px; }
        .btn-danger { background-color: var(--accent); }
        .history-box { display: flex; flex-wrap: wrap; gap: 6px; min-height: 45px; background: #0f172a; padding: 10px; border-radius: 8px; align-items: center; margin-bottom: 10px; }
        .history-item { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; color: white; }
        .hi-B { background-color: var(--banker); }
        .hi-P { background-color: var(--player); }
        .hi-T { background-color: var(--tie); }
        .result-box { background: #0f172a; padding: 12px; border-radius: 8px; font-size: 0.9rem; }
        .highlight { color: var(--primary); font-weight: bold; }
        .recommendation { font-size: 1.05rem; font-weight: bold; padding: 8px; text-align: center; border-radius: 6px; margin-top: 8px; }
        .rec-B { background: rgba(239, 68, 68, 0.2); color: var(--banker); border: 1px solid var(--banker); }
        .rec-P { background: rgba(59, 130, 246, 0.2); color: var(--player); border: 1px solid var(--player); }
        .flex-row { display: flex; gap: 10px; }
        .flex-row button { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <h1>Dự Đoán Cầu Baccarat</h1>

    <div class="card">
        <h2>Nhập Lịch Sử Ván Cầu</h2>
        <div class="btn-group">
            <button class="btn-banker" onclick="addResult('B')">Banker (Cái)</button>
            <button class="btn-player" onclick="addResult('P')">Player (Con)</button>
            <button class="btn-tie" onclick="addResult('T')">Tie (Hoà)</button>
        </div>
        <div class="flex-row">
            <button class="btn-action btn-danger" onclick="undoResult()">Xóa ván cuối</button>
            <button class="btn-action" onclick="resetAll()">Làm mới</button>
        </div>
    </div>

    <div class="card">
        <h2>Chuỗi Cầu Gần Nhất</h2>
        <div class="history-box" id="historyDisplay">
            <span style="color: var(--text-secondary); font-size: 0.8rem;">Chưa có dữ liệu...</span>
        </div>
    </div>

    <div class="card">
        <h2>Phân Tích Thế Cầu & Gợi Ý</h2>
        <div class="result-box" id="predictionResult">
            Hãy nhập ít nhất 3-4 ván để hệ thống nhận diện cầu (1-1, 1-2, 2-2, 2-1-2, Bệt...).
        </div>
    </div>
</div>

<script>
    let history = [];

    function addResult(type) {
        history.push(type);
        updateUI();
    }

    function undoResult() {
        history.pop();
        updateUI();
    }

    function resetAll() {
        history = [];
        updateUI();
    }

    function updateUI() {
        const histBox = document.getElementById('historyDisplay');
        if (history.length === 0) {
            histBox.innerHTML = '<span style="color: var(--text-secondary); font-size: 0.8rem;">Chưa có dữ liệu...</span>';
        } else {
            histBox.innerHTML = history.map(h => `<div class="history-item hi-${h}">${h}</div>`).join('');
        }
        analyzePattern();
    }

    function analyzePattern() {
        const resBox = document.getElementById('predictionResult');
        if (history.length < 3) {
            resBox.innerHTML = "Cần thêm kết quả để quét mẫu cầu...";
            return;
        }

        let cleanHist = history.filter(x => x !== 'T');
        if (cleanHist.length < 3) {
            resBox.innerHTML = "Đang tích lũy chuỗi B/P...";
            return;
        }

        let runs = [];
        let currentRunChar = cleanHist[0];
        let currentRunLen = 1;

        for (let i = 1; i < cleanHist.length; i++) {
            if (cleanHist[i] === currentRunChar) {
                currentRunLen++;
            } else {
                runs.push({ char: currentRunChar, len: currentRunLen });
                currentRunChar = cleanHist[i];
                currentRunLen = 1;
            }
        }
        runs.push({ char: currentRunChar, len: currentRunLen });

        let lastChar = cleanHist[cleanHist.length - 1];
        let oppositeChar = lastChar === 'B' ? 'P' : 'B';
        let suggestedMove = oppositeChar;
        let patternName = "Nhịp hỗn hợp / Đang tạo hình";
        let confidence = "Trung bình";

        let lastRun = runs[runs.length - 1];
        
        // Nhận diện Cầu Bệt
        if (lastRun.len >= 3) {
            patternName = `Cầu Bệt (${lastRun.char}) dài ${lastRun.len} tay`;
            suggestedMove = lastRun.char;
            confidence = "Cao (Theo bệt)";
        } 
        // Nhận diện Cầu 1-1
        else if (runs.length >= 3 && runs[runs.length-1].len === 1 && runs[runs.length-2].len === 1 && runs[runs.length-3].len === 1) {
            patternName = "Cầu 1-1 (Đảo liên tục)";
            suggestedMove = oppositeChar;
            confidence = "Khá cao";
        }
        else if (runs.length >= 3) {
            let r1 = runs[runs.length-3].len;
            let r2 = runs[runs.length-2].len;
            let r3 = runs[runs.length-1].len;

            if (r1 === 1 && r2 === 2 && r3 === 1) {
                patternName = "Cầu 1-2-1";
                suggestedMove = oppositeChar;
            } else if (r1 === 2 && r2 === 1 && r3 === 2) {
                patternName = "Cầu 2-1-2";
                suggestedMove = oppositeChar;
            } else if (r1 === 1 && r2 === 2) {
                patternName = "Cầu 1-2";
                suggestedMove = lastChar;
            } else if (r1 === 2 && r2 === 1) {
                patternName = "Cầu 2-1";
                suggestedMove = oppositeChar;
            } else if (r1 === 2 && r2 === 2) {
                patternName = "Cầu 2-2";
                suggestedMove = lastRun.len === 2 ? oppositeChar : lastChar;
            } else {
                patternName = `Mẫu phức hợp (${r1}-${r2}-${r3})`;
                suggestedMove = oppositeChar;
            }
        }

        let fullName = suggestedMove === 'B' ? 'BANKER (CÁI)' : 'PLAYER (CON)';
        let recClass = suggestedMove === 'B' ? 'rec-B' : 'rec-P';

        resBox.innerHTML = `
            <div>Thế cầu nhận diện: <span class="highlight">${patternName}</span></div>
            <div>Độ tin cậy: <span class="highlight">${confidence}</span></div>
            <div style="margin-top: 6px;">Gợi ý đặt cược tay tiếp theo:</div>
            <div class="recommendation ${recClass}">${fullName}</div>
        `;
    }
</script>

</body>
</html>
